name: sweet shim (dipa-studio boot path)
on:
  workflow_dispatch:
  push:
    branches: [sweet-port]
    paths: ['.github/workflows/sweet-shim.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DIPA: fdad0de8dc0e75c5ea84762adc03f7232dc91f19
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu cpio mkbootimg python3 wget unzip
      - name: Clone the working shim source (MIT)
        run: |
          git init dipa
          git -C dipa remote add origin https://github.com/dipa-studio/ios-sweet.git
          git -C dipa fetch --depth 1 origin "$DIPA"
          git -C dipa checkout -q FETCH_HEAD
          git -C dipa log -1 --oneline
      - name: Extract the device DTB from the public OrangeFox recovery
        run: |
          curl -sL -o ofox.zip https://github.com/basamaryan/android_device_xiaomi_sweet-TWRP/releases/download/R11.1_7/OrangeFox-R11.1_7-Unofficial-sweet.zip
          unzip -o -j ofox.zip '*recovery.img' -d ofox || unzip -o ofox -d ofox
          REC=$(find ofox -name 'recovery.img' | head -1)
          python3 - "$REC" <<'EOF'
          import struct, sys, zlib
          img = open(sys.argv[1], "rb").read()
          kernel_size = struct.unpack_from("<I", img, 8)[0]
          page = struct.unpack_from("<I", img, 36)[0]
          d = zlib.decompressobj(16 + zlib.MAX_WBITS)
          d.decompress(img[page:page + kernel_size])
          dtb = d.unused_data
          assert dtb[:4] == b"\xd0\x0d\xfe\xed"
          import os
          os.makedirs("dtb/boot_unpacked", exist_ok=True)
          open("dtb/boot_unpacked/dtb", "wb").write(dtb)
          print("dtb:", len(dtb), "bytes")
          EOF
      - name: "Build the shim (diagnostics ramdisk, no payload)"
        run: |
          # Ubuntu's mkbootimg package is broken (missing its gki module);
          # use the repo's own AOSP mkbootimg.py through a PATH wrapper.
          sudo apt-get remove -y mkbootimg || true
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec python3 "%s/prebuilt/uefi/mkbootimg.py" "$@"\n' \
            "$GITHUB_WORKSPACE" > "$HOME/.local/bin/mkbootimg"
          chmod +x "$HOME/.local/bin/mkbootimg"
          cd dipa/shim
          # The host_test step needs an x86 display dump; harmless to skip.
          sed -i '/host_test/d' build.sh
          ./build.sh
          ls -la out/
          sha256sum out/shim-boot.img
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sweet-shim-boot
          path: |
            dipa/shim/out/shim-boot.img
            dipa/shim/out/Image
